name: Build

on:
  push:
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtpdf
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $output = & cmake --preset windows-msvc-debug "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            $details = ($output | Select-Object -Last 30 | Out-String).Trim()
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=CMake configure failed::$details"
            exit $exitCode
          }

      - name: Build
        run: cmake --build --preset windows-msvc-debug

      - name: Test
        shell: pwsh
        run: |
          $reportPath = Join-Path $PWD 'build/windows-msvc-debug/test-results/ctest.xml'
          ctest --preset windows-msvc-debug --output-junit $reportPath
          exit $LASTEXITCODE

      - name: Publish QtTest diagnostics
        if: always()
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Path 'build/windows-msvc-debug/test-results/*.txt' -ErrorAction SilentlyContinue
          foreach ($report in $reports) {
            Write-Output "::group::$($report.Name)"
            Get-Content -LiteralPath $report.FullName | ForEach-Object { Write-Host $_ }
            Write-Output '::endgroup::'

            $failures = Select-String -LiteralPath $report.FullName -Pattern '^FAIL!' -Context 0,6
            foreach ($failure in $failures) {
              $details = (@($failure.Line) + $failure.Context.PostContext) -join "`n"
              $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=QtTest failure::$details"
            }
          }

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-debug-test-results-${{ github.run_attempt }}
          path: |
            build/windows-msvc-debug/test-results/
            build/windows-msvc-debug/Testing/Temporary/LastTest.log
            build/windows-msvc-debug/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: warn
          retention-days: 14
